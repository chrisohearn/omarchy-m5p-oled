# K114: the three-channel microphone array on PCM 0 of the AOP card (48 kHz, float32).
# Like alsa-ucm-conf-aurora's aop_audio/3chan/HiFi.conf, without its JackControl: this kernel's
# microphone card has no "Internal Mic Jack" control.

SectionDevice."Mic" {
	Comment "Microphone"

	Value {
		TQ Voice
		CaptureChannels "3"
		CapturePriority 100
		CapturePCM "hw:${CardId},0"
	}
}
