# /run/systemd/sleep.conf.d/40-k114s-lid-sleep.conf  (written at boot by k114s-lid-sleep, on an ordinary boot only)
# Suspend-to-idle only: freeze is what the attended passes of 2026-11-24 ran, and deep sleep is compiled out.
# Hibernate and hybrid sleep stay refused (no swap image).
[Sleep]
AllowSuspend=yes
SuspendState=freeze
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
