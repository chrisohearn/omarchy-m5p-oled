# K114s (omarchy-m5p-oled): MacBook Pro 14-inch OLED, M5 Pro.
#
# The microphone array is PCM 0 of the AOP card AppleK114HPAI. asahi-audio's rules match
# "AppleJ...HPAI" only, so the raw array gets its RawMics name here and a mono source on top of it.
#
# The jack card AppleK114 has no loudspeaker path. Its PCM 1 and PCM 2 are the front-ends the
# speakers would use on a J714; on this Mac they lead nowhere (PCM 1 cannot even be opened), so
# no profile may turn them into nodes.
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.path = "hw:AppleK114HPAI,0" }
    ]
    actions = {
      update-props = {
        node.name = "alsa_input.platform-sound.RawMics"
        node.description = "Raw Mic Device (do not use)"
        node.nick = "RawMics"
      }
    }
  }
  # The jack card offers "HiFi" (its UCM profile: Headphones and Headset Microphone on PCM 0) and
  # "Off" only. PipeWire builds a pro-audio profile for a card by opening every PCM it has, PCM 1
  # and PCM 2 included (acp.c, add_pro_profile), when the card is first seen. With nothing
  # plugged in, pro-audio would also be the only profile beside "Off": picked by hand, WirePlumber
  # then keeps it over HiFi. The same property asahi-audio sets on the jack-only cards (a67903a;
  # its rule matches names ending in " Jack", which this card's does not) and speakerguardd v2
  # sets on a speaker card it owns (gen.py, wireplumber_raw_conf). A device property: the card is
  # matched by its name.
  {
    matches = [
      { device.name = "~alsa_card.*", api.alsa.card.name = "MacBook Pro K114" }
    ]
    actions = {
      update-props = {
        api.acp.disable-pro-audio = true
      }
    }
  }
  # Keep the jack's output open between streams: PipeWire suspends an idle sink after five seconds
  # and powers the headphone amplifier down, and every start and stop of playback then pops. The
  # same rule omarchy-mac installs for AppleJ... cards (asahi-audio-no-suspend.conf), which does
  # not match this card. PCM 0 only, and only a sink: PCM 1 and PCM 2 are never nodes (below), and
  # capture nodes still suspend.
  {
    matches = [
      { api.alsa.path = "hw:AppleK114,0", media.class = "Audio/Sink" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
  # Should a node on PCM 1 or PCM 2 be asked for anyway, it is not created. The first two lines
  # match a node a UCM profile names, the last two a pro-audio node (WirePlumber copies the
  # card's alsa.id onto its nodes): the four matches speakerguardd v2 writes for a card it owns.
  {
    matches = [
      { api.alsa.path = "hw:AppleK114,1" }
      { api.alsa.path = "hw:AppleK114,2" }
      { alsa.id = "AppleK114", alsa.device = 1 }
      { alsa.id = "AppleK114", alsa.device = 2 }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]

node.software-dsp.rules = [
  {
    matches = [
      { api.alsa.path = "hw:AppleK114HPAI,0" }
    ]
    actions = {
      create-filter = {
        filter-path = "/usr/local/share/omarchy-k114s/audio/mic.json"
        hide-parent = true
      }
    }
  }
]
