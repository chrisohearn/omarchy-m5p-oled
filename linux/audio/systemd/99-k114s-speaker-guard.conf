# K114s (omarchy-m5p-oled): this unit may act on the loudspeakers' protection only on this Mac's own
# qualification. The marker below is created by the OWNER, by hand, after docs/r3-audio.md Stage B has
# every proof; nothing in this repository creates it. Without it the unit is skipped, whatever package
# ships a profile or a unit for a sibling model that shares the card name (the K114c, M5 Max, does).
# It sorts last on purpose, and it adds to every other condition on the unit; none is replaced.
[Unit]
ConditionPathExists=/etc/omarchy-k114s/speaker-qualification
