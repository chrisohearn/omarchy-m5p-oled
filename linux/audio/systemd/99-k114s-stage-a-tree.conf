# K114s (omarchy-m5p-oled): WirePlumber (the only thing that opens the sound cards for a user) runs only
# when the device tree that booted is no tree, or the Stage A tree (jack and microphones, no speaker
# path). A packaged tree of a sibling model carries a real speaker path: refused here.
[Service]
ExecCondition=/usr/local/lib/omarchy-k114s/audio/tree-check
