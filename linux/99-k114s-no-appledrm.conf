# K114s (omarchy-m5p-oled): keep the display driver out of every initramfs built on this Mac.
# Installed as /etc/mkinitcpio.conf.d/99-k114s-no-appledrm.conf by initramfs-no-appledrm-k114s.
#
# mkinitcpio's autodetect and kms hooks read the modaliases of the running system, so a build made
# while appledrm is loaded (a display-tree boot) would put it in the image, and the display driver
# would then probe before the root is mounted. add_module returns at once for a module already
# counted as added, so counting appledrm and dcp_fabric_core (its fabric power-domain driver, whose
# only user it is) as added keeps both out, and the dependencies only they pull in with them
# (the display crossbar, the DP alt-mode driver). Nothing else is removed: apple_pmp (a MODULES
# entry of 92-omarchy-mac-pmp.conf), drm_dma_helper, snd, typec stay wherever a hook or a MODULES
# entry still adds them. simpledrm is built in and is not a module, so it is untouched. The
# check is on the array's type: a context that sources this file without mkinitcpio's
# associative _addedmodules (a hook sourcing the configuration) does nothing.
# Note: mkinitcpio reads /etc/mkinitcpio.conf.d only when no -c (and no preset config) is given.
if [[ $(declare -p _addedmodules 2>/dev/null) == "declare -A"* ]]; then
  _addedmodules[appledrm]=1
  _addedmodules[dcp_fabric_core]=1
fi
