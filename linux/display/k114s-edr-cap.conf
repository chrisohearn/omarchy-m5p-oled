# K114s (omarchy-m5p-oled): panel EDR (HDR) on, capped at 1200 nits; installed by linux/display/k114s-edr-cap.
# The K114s kernel's default cap (hdr/0003) is 500 nits, below the panel's 1000-nit SDR maximum, so EDR is off without this
# file. 1200 is the cap the owner watched on 2026-11-16 (docs/r3-hdr.md section 8); the panel's ADT peak is 2000 nits.
# appledrm is not in the initramfs, so this file applies when the DCP binds at the next boot.
options appledrm fw27_panel_edr_max_nits=1200
