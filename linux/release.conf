# K114s (omarchy-m5p-oled) r3: settings of the release tooling. KEY=value, read as data.
# Installed to /etc/omarchy-k114s/release.conf; an existing file is kept.

# Release a held package by itself once the channel's build passes release-criteria.conf.
# The owner's choice (2026-11-14): on. "no" only reports.
AUTO_RELEASE=yes

# Kernel and firmware packages: install the fixed build as an ADDITIONAL boot entry by itself.
# The proven entry stays the default and nothing is retired until the new one has booted.
AUTO_RELEASE_BOOT=yes

# The GPU stack (mesa-aurora, vulkan-aurora, hyprland-m5: keep-held): released by itself only with "yes".
# Default no, so it only reports: its rollback cannot yet bring back the dependencies a new build
# pulls in (a new LLVM), so an unattended switch could leave the desktop without a way back.
AUTO_RELEASE_GPU=no

# Retire the old boot image by itself on a later run, once the new chain has recorded this many
# successful boots (desktop reached, Wi-Fi interface and trackpad present) and is the one running.
AUTO_RETIRE=yes
RETIRE_AFTER_BOOTS=2

# m1n1 Stage 2 (loader, U-Boot, device tree) is shared by every boot entry: a new one cannot be
# tried beside the old one, and the way back is from macOS. So this one waits for the owner:
#     sudo /usr/local/lib/omarchy-k114s/k114s-release stage2
AUTO_STAGE2_SWITCH=no

# Megabytes kept free on the EFI partition after every planned write (the macOS tool keeps 8).
ESP_MARGIN_MB=8

# Recovery sets kept under /var/lib/omarchy-k114s/recovery, per label.
RECOVERY_KEEP=3

# Desktop notifications from the check and the release.
NOTIFY=yes

# What a successful boot must show (k114s-boot-success).
BOOT_NET_INTERFACE=wlan0
BOOT_TRACKPAD_NAME=Apple MTP multi-touch
BOOT_WAIT_SECONDS=300
