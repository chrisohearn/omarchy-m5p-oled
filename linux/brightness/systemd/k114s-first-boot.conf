# K114s: keep systemd-backlight from writing the panel's level, at boot or at shutdown, until the
# owner has seen the stepped check pass. Installs to (root step, the owner's or the lead's):
#
#   /etc/systemd/system/systemd-backlight@backlight:apple-panel-bl.service.d/k114s-first-boot.conf
#
# Why: with no saved level (the first boot), systemd-backlight's load reads the current level,
# raises it to at least 1 % (newer systemd) or 5 % (per the 262 man page) of the maximum and
# writes it back. On the first boot with the panel on
# the display coprocessor the kernel may not know the boot stage's level and reads half the
# maximum, so that write would be a level-carrying present a few seconds into every boot,
# unattended, on an OLED whose response is unproven. With the marker file absent the unit is
# skipped (neither the boot-time load nor the shutdown-time save runs), so nothing writes.
#
# To turn restoring on, after docs/r3-brightness.md steps 3 and 5 passed (root):
#   install -d /var/lib/k114s-backlight && touch /var/lib/k114s-backlight/restore-enabled
#   systemctl start 'systemd-backlight@backlight:apple-panel-bl.service'
# The start writes back the level you set last (harmless); the next shutdown then saves it. Without
# the start, the unit does not run until the next boot, which finds no saved file and writes N/2.
# To turn it off again: rm /var/lib/k114s-backlight/restore-enabled
#
# systemd.restore_state=0 on the kernel command line is NOT the same: it skips only the boot-time
# load; the shutdown save still runs, and the next boot without the parameter restores that level.
[Unit]
ConditionPathExists=/var/lib/k114s-backlight/restore-enabled
