# /run/systemd/logind.conf.d/40-k114s-lid-sleep.conf  (written at boot by k114s-lid-sleep, on an ordinary boot only)
# Lid close: suspend-to-idle on battery, lock on external power, nothing when docked. It sorts after the
# 30-k114s-r3a-trial.conf lock in /etc, which is what a trial boot (or a gate that did not run) keeps.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=lock
HandleLidSwitchDocked=ignore
IdleAction=ignore
