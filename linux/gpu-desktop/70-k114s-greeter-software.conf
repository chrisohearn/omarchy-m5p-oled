# Install as /etc/sddm.conf.d/70-k114s-greeter-software.conf (sorts after 60-aurora-m5-display.conf).
# The greeter's Hyprland gets no ASAHI_M5_BRINGUP, so with the GPU's render node present Mesa refuses
# the device and Hyprland aborts in initEGL: no login screen. Keep the greeter on the CPU.
# REMOVE this file before the display coprocessor step (r3), whose greeter must use the GPU.
[Wayland]
CompositorCommand=/usr/bin/env LIBGL_ALWAYS_SOFTWARE=1 GBM_ALWAYS_SOFTWARE=1 /usr/lib/omarchy-aurora/start-hyprland-m5 -- --config /usr/share/sddm/hyprland.lua
