# /etc/systemd/logind.conf.d/30-k114s-r3a-trial.conf  (then: systemctl kill -s HUP systemd-logind)
# The r3a kernel admits the K114s to suspend-to-idle (sleep-lid/0003), which has never resumed on this Mac, and the
# r3a device tree turns the lid from an "external display" case into a real lid (the connector becomes eDP-1, so
# omarchy-system-lid-inhibit stops holding logind's lid inhibitor). Until an attended suspend test passes, a closed
# lid locks the session and never suspends. The suspend targets are masked as well; this is the second lock.
[Login]
HandleLidSwitch=lock
HandleLidSwitchExternalPower=lock
HandleLidSwitchDocked=ignore
IdleAction=ignore
