# K114s (omarchy-m5p-oled) r3: when is the channel's build of a held package "fixed for K114s"?
# Read by k114s-release-check. Data only: nothing here is executed.
#
#   package NAME CLASS            CLASS is  boot-uki     its transaction rebuilds the boot image (kernel, firmware)
#                                           boot-stage2  it feeds m1n1 Stage 2 (loader, U-Boot)
#                                           userland     it can be switched directly (rollback archive kept)
#   check NAME LABEL TYPE ARG...  must pass
#   any   NAME LABEL TYPE ARG...  lines of one NAME and LABEL: at least one must pass
#
# A package is "fixed" when every check and every any-group passes. A held package without a
# "package" line here stays held: no criteria, no release. FILE arguments are globs inside the
# channel's package; the package is unpacked in a private cache and never installed by the check.
#
# TYPEs:
#   version-newer [REGEX]                 the channel version sorts above the installed one (vercmp),
#                                         or, with REGEX naming OUR build tag inside the installed
#                                         version (".v272", ".j714s3", an epoch): it is the channel's
#                                         build of the same or a later upstream version. A tagged
#                                         build sorts above the channel's for ever otherwise. The
#                                         identical version never passes. This check only says "not
#                                         older"; the checks after it say "fit". pacman sees such a
#                                         release as a downgrade and makes it because it is named.
#   file-exists GLOB
#   file-contains GLOB STRING...          the file holds the byte string (binary safe; rest of line)
#   file-matches GLOB REGEX               a text file has a line matching the extended regex
#   dtb-root-compatible GLOB STRING       the tree's root compatible list has STRING
#   dtb-node GLOB SELECTOR                a node exists          (SELECTOR: see k114s-fdt)
#   dtb-okay GLOB SELECTOR MIN            at least MIN matching nodes are enabled
#   dtb-prop GLOB SELECTOR PROP VALUE     the property reads VALUE (cells as 0x%08x)
#   kconfig GLOB FRAGMENT                 the kernel image's built-in config meets every line of
#                                         FRAGMENT (a file beside this one, in the language of
#                                         build/validate-config.py: =y, =m "or built in", "is not set")
#   module-parm GLOB NAME                 the kernel module has that parameter (modinfo)
#   code-imm16 GLOB HEX                   the module compares with or loads that 16-bit constant
#                                         (AArch64 cmp/movz; evidence, not proof)
#   depends-on REGEX                      the package's depend lines match
#   not-installed NAME                    that package is not installed here
#   manual TEXT...                        never passes: a person decides (TEXT says what)
#
# Sources for each line: docs/upstream-applicability.md and docs/r3-update-tooling.md.

# --- kernel -------------------------------------------------------------------------------------
# Ours: aurora-silicon/linux a34d26c2 + betizzel linux-j714s-27.2 (v272-4) + PR 1568, release K114S-R1.
package linux-aurora boot-uki
check linux-aurora newer            version-newer       \.v272
check linux-aurora k114s-tree       file-exists         usr/lib/modules/*/dtbs/t6050-k114s.dtb
check linux-aurora k114s-identity   dtb-root-compatible usr/lib/modules/*/dtbs/t6050-k114s.dtb apple,k114s
# Wi-Fi/Bluetooth (N1): this board's platform id is board-id 0x14 << 16 | chip 0x6050
check linux-aurora n1-platform-id   dtb-prop            usr/lib/modules/*/dtbs/t6050-k114s.dtb compatible:pci106b,1900 apple,centauri-platform-id 0x00146050
check linux-aurora n1-wifi          dtb-node            usr/lib/modules/*/dtbs/t6050-k114s.dtb compatible:pci106b,1902
check linux-aurora n1-bluetooth     dtb-node            usr/lib/modules/*/dtbs/t6050-k114s.dtb compatible:pci106b,1903
check linux-aurora n1-pcie          dtb-okay            usr/lib/modules/*/dtbs/t6050-k114s.dtb compatible:apple,t6050-pcie 1
# two USB-C host ports (left-front, right): controller and port controller each
check linux-aurora usb-controllers  dtb-okay            usr/lib/modules/*/dtbs/t6050-k114s.dtb compatible:apple,t6050-dwc3 2
check linux-aurora usb-port-control dtb-okay            usr/lib/modules/*/dtbs/t6050-k114s.dtb compatible:apple,sn201202x 2
# SMC sensors and fans
check linux-aurora sensors          dtb-okay            usr/lib/modules/*/dtbs/t6050-k114s.dtb compatible:apple,smc-hwmon 1
# keyboard and trackpad transport
check linux-aurora input-transport  dtb-okay            usr/lib/modules/*/dtbs/t6050-k114s.dtb compatible:apple,dockchannel-hid 1
# the drivers the tree needs
check linux-aurora n1-driver        file-exists         usr/lib/modules/*/kernel/drivers/net/wireless/apple/centauri/t6050/apple_centauri_t6050.ko*
check linux-aurora trackpad-driver  file-exists         usr/lib/modules/*/kernel/drivers/hid/hid-magicmouse.ko*
# Trackpad. The K114s reports product 0x0361 and an oversized Report Size. Either fix B
# (aurora-silicon/linux PR 1568, Joshua Warren: clamp in dockchannel-hid, 0x5a report parser)...
any   linux-aurora trackpad         file-contains       usr/lib/modules/*/vmlinuz clamping Report Size
# ...or fix A (PR 1830, Jens Axboe: Trackpad26 frames, gated on a product id) admitting 0x0361.
any   linux-aurora trackpad         code-imm16          usr/lib/modules/*/kernel/drivers/hid/hid-magicmouse.ko* 0x0361
# The report-size clamp of either fix must be in the image (dockchannel-hid is built in).
any   linux-aurora report-clamp     file-contains       usr/lib/modules/*/vmlinuz clamping Report Size
any   linux-aurora report-clamp     file-contains       usr/lib/modules/*/vmlinuz clamping report size
# the options the image's kernel lacks (firewall IPv6 rules, Bluetooth hands-free, key parser, ...)
check linux-aurora config           kconfig             usr/lib/modules/*/vmlinuz kernel-config.required

# --- loader and U-Boot (m1n1 Stage 2) --------------------------------------------------------------
# Ours: aura 22b71758 + betizzel aura-j714s-27.2. The channel's 1.6.1.aurora23 knows no T6050.
package m1n1-aurora boot-stage2
check m1n1-aurora newer             version-newer       \.v272
check m1n1-aurora t6050             file-contains       usr/lib/asahi-boot/m1n1.bin apple,t6050
check m1n1-aurora t6050-pcie        file-contains       usr/lib/asahi-boot/m1n1.bin apcie,t6050
check m1n1-aurora t6050-phy         file-contains       usr/lib/asahi-boot/m1n1.bin atc-phy,t6050

package uboot-aurora boot-stage2
check uboot-aurora newer            version-newer       \.j714s[0-9]+
check uboot-aurora t6050-nvme       file-contains       usr/lib/asahi-boot/u-boot-nodtb.bin apple,t6050-nvme-ans2
check uboot-aurora t6050-sart       file-contains       usr/lib/asahi-boot/u-boot-nodtb.bin apple,t6050-sart

# --- firmware ---------------------------------------------------------------------------------------
# The image's script loads the N1 driver for apple,j714s only ("no sibling board inherits it").
package omarchy-aurora-firmware boot-uki
check omarchy-aurora-firmware newer        version-newer \.j714s[0-9]+
check omarchy-aurora-firmware n1-for-k114s file-matches usr/lib/omarchy/initcpio/aurora-peripheral-firmware.sh apple,k114s
check omarchy-aurora-firmware n1-module    file-matches usr/lib/initcpio/install/aurora-vendor-order add_module[[:space:]]+apple_centauri

# --- graphics -----------------------------------------------------------------------------------------
# The K114s GPU (G17S) is not driven yet, so today any Mesa renders on llvmpipe. The channel's
# build must not sort below ours and must still carry the M5 Pro driver.
package mesa-aurora userland
check mesa-aurora newer             version-newer
check mesa-aurora g17s              file-contains       usr/lib/libgallium-*.so G17S

package vulkan-aurora userland
check vulkan-aurora newer           version-newer
check vulkan-aurora g17s            file-contains       usr/lib/libvulkan_asahi.so G17S

# --- compositor ---------------------------------------------------------------------------------------
# hyprland-m5 (betizzel) writes alpha for the OLED and latches direct scanout; the channel has no
# package of this name. If one appears it must be newer. Replacing it with the stock "hyprland"
# is a different package and a person's decision (rivals.list keeps that from happening by itself).
package hyprland-m5 userland
check hyprland-m5 newer             version-newer
check hyprland-m5 decision          manual              hyprland-m5 has no upstream criteria yet: the OLED alpha fix (aurora-silicon/linux issue 1873) is not in a channel build

# The title-bar plugin must be compiled against the headers of the Hyprland that loads it. The
# channel's is built against stock Hyprland; with hyprland-m5 it reads CMonitor 32 bytes off and
# takes the compositor down. Fixed when the channel's build names hyprland-m5 as its dependency,
# or when hyprland-m5 is no longer the compositor here.
package omarchy-hyprland-titlebars userland
check omarchy-hyprland-titlebars newer   version-newer  ^[0-9]+:|\+m5
any   omarchy-hyprland-titlebars abi     depends-on     ^hyprland-m5=
any   omarchy-hyprland-titlebars abi     not-installed  hyprland-m5

# --- the boot tooling itself ----------------------------------------------------------------------------
# These are the channel's own builds (not K114s builds), held because their hooks and scripts
# write the boot files: the tool that builds the boot image and the menu, the loader every entry
# starts from, update-m1n1, the boot check. A newer one is a change to how this Mac boots, with
# nothing in the package that can be checked for "knows the K114s". So a person decides, per
# package:      sudo k114s-release release --accept-manual NAME
# which still makes the rollback set and, for the boot classes, goes through the trial steps.
# Holding them for long will eventually stop "omarchy update" on a dependency; see docs/r3-update-tooling.md.
package omarchy-mac-boot boot-uki
check omarchy-mac-boot newer        version-newer
check omarchy-mac-boot decision     manual   the boot check and boot hooks changed: read its changes before letting it rewrite the boot image

package limine-mkinitcpio-hook boot-uki
check limine-mkinitcpio-hook newer  version-newer
check limine-mkinitcpio-hook decision manual  it writes every boot image and limine.conf: check that it keeps the K114s entries (### K114s blocks) and default_entry

package limine boot-uki
check limine newer                  version-newer
check limine decision               manual   one loader file (EFI/BOOT/BOOTAA64.EFI) starts every entry: it cannot be tried beside the old one

package asahi-scripts boot-stage2
check asahi-scripts newer           version-newer
check asahi-scripts decision        manual   update-m1n1 builds m1n1/boot.bin, which the K114s Stage 2 is cut from

package asahi-fwextract userland
check asahi-fwextract newer         version-newer
check asahi-fwextract decision      manual   it unpacks the vendor firmware at boot (Wi-Fi, trackpad): try it with a rollback archive at hand

package omarchy-mac userland
check omarchy-mac newer             version-newer
check omarchy-mac decision          manual   Mac setup scripts and services: read its changes for anything J714s-only
