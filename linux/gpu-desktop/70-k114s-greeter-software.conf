# Install as /etc/sddm.conf.d/70-k114s-greeter-software.conf (sorts after 60-aurora-m5-display.conf).
# start-hyprland-m5 exports aurora-m5-display-env, so the greeter's Hyprland does get ASAHI_M5_BRINGUP (=1 on a DCP boot). With the
# GPU's render node present Mesa refuses the device and Hyprland aborts in initEGL: no login screen, so the greeter stays on the CPU.
# sudo bash linux/display/k114s-greeter-colour repoints the compositor config below at its own copy (hyprland-k114s.lua in /etc/sddm: the stock config plus the DCP
# colour guard); this file therefore carries the guard too: removing it removes the guard and P9 stops.
# To drop the guard only, run k114s-greeter-colour --undo.
[Wayland]
CompositorCommand=/usr/bin/env LIBGL_ALWAYS_SOFTWARE=1 GBM_ALWAYS_SOFTWARE=1 /usr/lib/omarchy-aurora/start-hyprland-m5 -- --config /usr/share/sddm/hyprland.lua
