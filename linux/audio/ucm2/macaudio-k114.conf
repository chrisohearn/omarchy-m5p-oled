Syntax 6

# MacBook Pro 14-inch OLED, M5 Pro (K114s), card "MacBook Pro K114" (apple,k114-macaudio).
# The card is the headphone jack alone: a CS42L84 on PCM 0. The built-in loudspeakers are not
# part of this card and this profile must not gain a device for them. The verb is the jack-only
# one alsa-ucm-conf-aurora ships for the J616s jack card (same codec, same control names).
SectionUseCase."HiFi" {
	Comment "Default"
	File "/conf.d/macaudio/cs42l84/HiFi-jack.conf"
}
