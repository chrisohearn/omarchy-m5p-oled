# K114s (omarchy-m5p-oled): let UPower show the SMC's own battery percentage (issue #152).
# UPower ignores the kernel's capacity on every machine whose DMI product name starts with "MacBook" (a workaround for
# Intel MacBooks: is_macbook() in src/linux/up-enumerator-udev.c, UPower 1.91.5) and shows energy / energy-full instead.
# On Apple Silicon the kernel's capacity is the SMC's BUIC, the percentage macOS shows and the one the charge limit uses.
# This gives upowerd alone a product name without that prefix; nothing else in upowerd reads the DMI name. The leading
# "-" ignores the line if the name file is missing, so upowerd still starts. Remove with k114s-upower-percentage --undo.
[Service]
BindReadOnlyPaths=-/etc/omarchy-k114s/upower-product-name:/sys/devices/virtual/dmi/id/product_name
