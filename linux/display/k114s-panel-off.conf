# K114s OLED: turn the panel off after 5 minutes idle and back on at the first key or pointer input (issue #22,
# omarchy-m5p-oled linux/display/k114s-panel-off). Omarchy's own idle service only starts the screensaver (60 s here) and
# the lock (off here); nothing powers the panel down, and a lit OLED left idle risks burn-in.
# omarchy-brightness-display off/on is the DPMS path proven on the DCP boot (docs/r3-display-d5-d9.md, D7; owner-watched
# again with this file's settings on 2026-11-16).
# T3 Code holds a systemd idle inhibitor while agents work ("Agents are working"). The panel does not need to stay lit for
# that, so systemd inhibitors are ignored. Wayland and D-Bus inhibitors (video players, browsers) still keep the panel on.
general {
    ignore_systemd_inhibit = true
}

listener {
    timeout = 300
    on-timeout = omarchy-brightness-display off
    on-resume = omarchy-brightness-display on
}
