# K114s (omarchy-m5p-oled): the sound node now exists, but it is the headphone jack and the
# microphones only. The card has no speaker link, so speakerguardd v2 has nothing to guard: its
# gate would wait 15 s for a speaker card in each of these units (two of them before logins are
# allowed) and then refuse. Skip them until a tree gives the card a second link, the speakers'.
# This adds to 90-k114s.conf; both conditions must hold.
[Unit]
ConditionPathExists=/proc/device-tree/sound/dai-link@1
