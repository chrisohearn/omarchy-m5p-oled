# K114s (omarchy-m5p-oled): MacBook Pro 14-inch OLED, M5 Pro.
#
# The microphone array is PCM 0 of the AOP card AppleK114HPAI. asahi-audio's rules match
# "AppleJ...HPAI" only, so the raw array gets its RawMics name here and a mono source on top of it.
#
# The jack card AppleK114 has no loudspeaker path. Its PCM 1 and PCM 2 are the front-ends the
# speakers would use on a J714; on this Mac they lead nowhere (PCM 1 cannot even be opened), so
# no profile may turn them into nodes.
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.path = "hw:AppleK114HPAI,0" }
    ]
    actions = {
      update-props = {
        node.name = "alsa_input.platform-sound.RawMics"
        node.description = "Raw Mic Device (do not use)"
        node.nick = "RawMics"
      }
    }
  }
  {
    matches = [
      { alsa.id = "AppleK114", alsa.device = 1 }
      { alsa.id = "AppleK114", alsa.device = 2 }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]

node.software-dsp.rules = [
  {
    matches = [
      { api.alsa.path = "hw:AppleK114HPAI,0" }
    ]
    actions = {
      create-filter = {
        filter-path = "/usr/local/share/omarchy-k114s/audio/mic.json"
        hide-parent = true
      }
    }
  }
]
