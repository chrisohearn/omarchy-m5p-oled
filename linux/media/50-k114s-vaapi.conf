# K114s (omarchy-m5p-oled, issue #30; installed by linux/media/k114s-vaapi). libva picks its driver from the DRM
# driver's name, "aurora" on the M5 GPU, and no aurora_drv_video.so exists; the Apple Video Decoder's VA-API driver
# is asahi_drv_video.so from libva-v4l2_request-avd.
LIBVA_DRIVER_NAME=asahi
